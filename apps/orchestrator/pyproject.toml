[tool.poetry]
name = "physics-foundry-orchestrator"
version = "0.1.0"
description = "FastAPI orchestrator for physics video generation pipeline"
authors = ["Physics Foundry <team@physics-foundry.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
websockets = "^12.0"
pydantic = "^2.5.0"
opentimelineio = "^0.16.0"
openai = "^1.3.0"
httpx = "^0.25.0"
python-multipart = "^0.0.6"
prometheus-client = "^0.19.0"
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-instrumentation-fastapi = "^0.42b0"
watchdog = "^3.0.0"
asyncio-mqtt = "^0.16.0"
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"