name: 🧹 Automated Maintenance

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Update dependencies
  dependency-updates:
    name: 📦 Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update npm dependencies
        working-directory: apps/gui
        run: |
          npm audit fix
          npm update
          npm outdated --json > outdated.json || true

      - name: Update Python dependencies  
        working-directory: apps/orchestrator
        run: |
          pip install --upgrade pip
          pip install pip-tools
          pip-compile --upgrade requirements.in

      - name: Create Pull Request for updates
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: '🔄 Automated dependency updates'
          body: |
            ## 📦 Dependency Updates
            
            This PR contains automated dependency updates:
            
            ### Updated packages:
            - npm packages updated to latest versions
            - Python packages updated to latest compatible versions
            
            ### Security updates:
            - All security vulnerabilities have been addressed
            
            Please review and merge if all checks pass.
          branch: automated/dependency-updates
          delete-branch: true

  # Clean up artifacts
  cleanup-artifacts:
    name: 🧹 Cleanup Artifacts  
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            
            const cutoffDate = new Date()
            cutoffDate.setDate(cutoffDate.getDate() - 30) // 30 days
            
            for (const artifact of artifacts.data.artifacts) {
              if (new Date(artifact.created_at) < cutoffDate) {
                console.log(`Deleting artifact: ${artifact.name}`)
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                })
              }
            }

  # Update documentation
  update-docs:
    name: 📚 Update Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate API documentation
        working-directory: apps/orchestrator
        run: |
          pip install sphinx sphinx-autoapi
          sphinx-build -b html docs docs/_build/html

      - name: Generate component documentation
        working-directory: apps/gui  
        run: |
          npm install --save-dev @storybook/cli
          npm run storybook:build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html

  # Performance monitoring
  performance-monitoring:
    name: ⚡ Performance Monitoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: apps/gui
        run: npm ci

      - name: Build application
        working-directory: apps/gui
        run: npm run build

      - name: Analyze bundle size
        working-directory: apps/gui
        run: |
          npm install --save-dev webpack-bundle-analyzer
          npx webpack-bundle-analyzer dist/assets/*.js --report --mode static --no-open
          
      - name: Check bundle size limits
        working-directory: apps/gui
        run: |
          # Check if bundle size exceeds limits (e.g., 1MB)
          BUNDLE_SIZE=$(find dist -name "*.js" -exec du -b {} + | awk '{sum += $1} END {print sum}')
          MAX_SIZE=1048576  # 1MB
          if [ "$BUNDLE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "Bundle size ($BUNDLE_SIZE bytes) exceeds maximum ($MAX_SIZE bytes)"
            exit 1
          fi

  # Security scanning
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SAST scan
        uses: github/super-linter@v5
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JSCPD: false

      - name: Run dependency security audit
        working-directory: apps/gui
        run: |
          npm audit --audit-level moderate
          
      - name: Run Python security audit
        working-directory: apps/orchestrator
        run: |
          pip install safety bandit
          safety check
          bandit -r . -f json -o security-report.json

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: apps/orchestrator/security-report.json

  # Health checks
  health-checks:
    name: 🏥 Health Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check repository health
        run: |
          # Check for large files
          find . -type f -size +100M -not -path "./node_modules/*" -not -path "./.git/*"
          
          # Check for secrets in code
          if grep -r "password\|secret\|key\|token" --include="*.ts" --include="*.tsx" --include="*.py" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "Potential secrets found in code"
            exit 1
          fi
          
      - name: Generate health report
        run: |
          echo "Repository Health Report" > health-report.md
          echo "========================" >> health-report.md
          echo "" >> health-report.md
          echo "Generated on: $(date)" >> health-report.md
          echo "" >> health-report.md
          echo "### Repository Size" >> health-report.md
          du -sh . >> health-report.md
          echo "" >> health-report.md
          echo "### File Counts" >> health-report.md
          echo "TypeScript files: $(find . -name "*.ts" -o -name "*.tsx" | wc -l)" >> health-report.md
          echo "Python files: $(find . -name "*.py" | wc -l)" >> health-report.md
          echo "JSON files: $(find . -name "*.json" | wc -l)" >> health-report.md

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.md