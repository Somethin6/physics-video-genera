name: Portfolio Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestrator-contract:
    name: Orchestrator contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency-light test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.5,<3" "pytest>=7.4,<9"

      - name: Compile portfolio contract modules
        run: |
          python -m py_compile \
            apps/orchestrator/orchestrator/core/dsl_models.py \
            apps/orchestrator/orchestrator/core/capabilities.py \
            apps/orchestrator/orchestrator/core/fixtures.py \
            apps/orchestrator/orchestrator/core/sandbox_policy.py \
            apps/orchestrator/orchestrator/core/sandbox.py

      - name: Run portfolio contract tests
        env:
          PYTHONPATH: apps/orchestrator
        run: |
          pytest -q apps/orchestrator/tests/test_portfolio_contract.py

      - name: Explain CI scope
        if: always()
        run: |
          echo "This job verifies dependency-light orchestration and sandbox policy contracts."
          echo "It does not claim GPU, LLM, Manim, Blender, Taichi, FFmpeg, firejail runtime, or end-to-end rendering capability."
